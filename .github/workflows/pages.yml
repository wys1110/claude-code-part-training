name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate 42-slide workshop
        run: |
          python scripts/refactor_42_slide_workshop.py /tmp/workshop.html

          python - <<'PY'
          import json, pathlib, re

          built = pathlib.Path('/tmp/workshop.html').read_text(encoding='utf-8')
          slides = re.findall(
              r'<section\s+class="[^"]*\bslide\b[^"]*"\s+data-slide="(\d+)"\s+data-minutes="([0-9.]+)"',
              built,
          )
          assert [slide_id for slide_id, _ in slides] == [str(i) for i in range(1, 43)], slides
          assert all(float(minutes) > 0 for _, minutes in slides)

          for marker in (
              'Claude Code Workshop',
              'Brainstorming',
              'Caveman',
              'Ponytail',
              'Claude Code vs Codex',
              '공개 URL',
              'Q&A',
          ):
              assert marker in built, marker

          notes_match = re.search(
              r'<script type="application/json" id="speaker-notes-data">(.*?)</script>',
              built,
              re.S,
          )
          assert notes_match
          notes = json.loads(notes_match.group(1))
          assert [note['slide'] for note in notes] == list(range(1, 43))
          print('Validated focused public workshop: 42 slides')
          PY

          python -m py_compile scripts/refactor_42_slide_workshop.py

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          python scripts/refactor_42_slide_workshop.py _site/index.html
          cp docs/handbook.md _site/handbook.md
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
