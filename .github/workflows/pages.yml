# Deployment refresh: 2026-07-31 22:26 KST
name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate sources
        run: |
          python - <<'PY'
          import pathlib, re

          text = ''.join(pathlib.Path(f'slides-{i}.js').read_text(encoding='utf-8') for i in range(1, 5))
          ids = re.findall(r'\{id:(\d+),', text)
          minutes = [float(v) for v in re.findall(r'\{id:\d+,section:[^\n]+?minutes:([0-9.]+),', text)]
          assert ids == [str(i) for i in range(1, 30)], ids
          assert len(minutes) == 29 and all(value > 0 for value in minutes)
          for required in ('index.html','styles.css','slides-1.js','slides-2.js','slides-3.js','slides-4.js','app.js'):
              assert pathlib.Path(required).is_file(), required

          workshop = pathlib.Path('drafts/solution-pe-portfolio-workshop/index.html').read_text(encoding='utf-8')
          source_slides = re.findall(
              r'<section\s+class="[^"]*\bslide\b[^"]*"\s+data-slide="(\d+)"\s+data-minutes="([0-9.]+)"',
              workshop,
          )
          assert [slide_id for slide_id, _ in source_slides] == [str(i) for i in range(1, 74)]
          assert all(float(value) > 0 for _, value in source_slides)
          print('Validated root deck and 73-slide workshop source')
          PY

          python scripts/build_workshop.py drafts/solution-pe-portfolio-workshop/index.html /tmp/workshop.html
          python scripts/enrich_skill_pages.py /tmp/workshop.html /tmp/workshop.html
          python scripts/add_companion_skills.py /tmp/workshop.html /tmp/workshop.html
          python scripts/add_tool_comparison.py /tmp/workshop.html /tmp/workshop.html

          python - <<'PY'
          import json, pathlib, re

          built = pathlib.Path('/tmp/workshop.html').read_text(encoding='utf-8')
          slides = re.findall(
              r'<section\s+class="[^"]*\bslide\b[^"]*"\s+data-slide="(\d+)"\s+data-minutes="([0-9.]+)"',
              built,
          )
          assert [slide_id for slide_id, _ in slides] == [str(i) for i in range(1, 82)], slides
          assert all(float(minutes) > 0 for _, minutes in slides)

          for marker in (
              '오늘 사용할 스킬은 세 개뿐이다',
              'brainstorming은 네 질문으로 요구사항을 고정한다',
              'Caveman은 정확성을 유지하면서 답을 압축한다',
              'Ponytail은 최소 구현 사다리를 따른다',
              'brainstorming · Caveman · Ponytail만 설치한다',
              'JuliusBrussee/caveman',
              'DietrichGebert/ponytail',
              '요구사항 정리 · 응답 압축 · 최소 구현',
          ):
              assert marker in built, marker
          for removed in (
              'writing-plans',
              'frontend-design',
              'systematic-debugging',
              'verification-before-completion',
          ):
              assert removed not in built, removed

          skill_pages = re.findall(
              r'<section\s+class="[^"]*\bthree-skill-slide\b[^"]*"\s+data-slide="(\d+)"\s+data-minutes="([0-9.]+)"',
              built,
          )
          assert [page for page, _ in skill_pages] == [str(i) for i in range(13, 27)], skill_pages
          assert all(float(minutes) >= 2 for _, minutes in skill_pages)

          comparison_slides = re.findall(
              r'<section\s+class="[^"]*\btool-comparison-slide\b[^"]*"\s+data-slide="(\d+)"\s+data-minutes="([0-9.]+)"',
              built,
          )
          assert comparison_slides == [('28', '3'), ('29', '3')], comparison_slides
          for marker in (
              'Claude Code vs Codex: 무엇이 다른가?',
              '도구가 아니라 작업 방식으로 선택한다',
              'https://docs.anthropic.com/en/docs/claude-code/overview',
              'https://openai.com/codex/',
          ):
              assert marker in built, marker

          assert '<h2>CONTENTS</h2>' in built
          assert '13–27' in built and '28–29' in built and '80–81' in built

          notes_match = re.search(
              r'<script type="application/json" id="speaker-notes-data">(.*?)</script>',
              built,
              re.S,
          )
          assert notes_match
          notes = json.loads(notes_match.group(1))
          assert [note['slide'] for note in notes] == list(range(1, 82))
          assert notes[12]['title'] == '오늘 사용할 스킬은 세 개뿐이다'
          assert notes[16]['title'] == 'brainstorming은 네 질문으로 요구사항을 고정한다'
          assert notes[17]['title'] == 'Caveman은 정확성을 유지하면서 답을 압축한다'
          assert notes[22]['title'] == 'Ponytail은 최소 구현 사다리를 따른다'
          assert notes[25]['title'] == 'brainstorming · Caveman · Ponytail만 설치한다'
          assert notes[27]['title'] == 'Claude Code vs Codex: 무엇이 다른가?'
          assert notes[28]['title'] == '도구가 아니라 작업 방식으로 선택한다'
          print('Validated public 81-slide workshop with only three named skills')
          PY

          python -m py_compile scripts/build_workshop.py scripts/enrich_skill_pages.py scripts/add_companion_skills.py scripts/add_tool_comparison.py
          node --check slides-1.js
          node --check slides-2.js
          node --check slides-3.js
          node --check slides-4.js
          node --check app.js
          node --test

      - name: Build minimal Pages artifact
        run: |
          mkdir -p _site/solution-pe-portfolio-workshop
          python scripts/build_workshop.py drafts/solution-pe-portfolio-workshop/index.html _site/index.html
          python scripts/enrich_skill_pages.py _site/index.html _site/index.html
          python scripts/add_companion_skills.py _site/index.html _site/index.html
          python scripts/add_tool_comparison.py _site/index.html _site/index.html
          cp _site/index.html _site/solution-pe-portfolio-workshop/index.html
          cmp _site/index.html _site/solution-pe-portfolio-workshop/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
